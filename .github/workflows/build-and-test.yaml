name: Build and Test

on:
  pull_request: # Trigger for pull requests.
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - v[0-9]*
  workflow_dispatch: # Allows for manual triggering.
    inputs:
      ref:
        description: "The ref to build and test."
        required: false
  schedule:
    # Run every night at midnight PST / 8am UTC, testing against the main branch.
    - cron: '0 8 * * *'

# If another instance of this workflow is started for the same PR, cancel the
# old one.  If a PR is updated and a new test run is started, the old test run
# will be cancelled automatically to conserve resources.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || inputs.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 120
    name: Build Player
    # Public fork PRs must not execute fork-controlled code on privileged ARC
    # runners. Same-repository PRs, pushes, schedules, and manual runs may use
    # the on-prem pool; fork PRs are intentionally skipped under the no-hosted
    # runner policy.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: default
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - name: Build Player
        # The test type-check alone took 12+ minutes on the default ARC pool,
        # so the old 20-minute cap timed out three runs in a row on 2026-11-04.
        timeout-minutes: 40
        run: python3 build/all.py --only-es5

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: player-build
          path: dist/

  build_and_test:
    timeout-minutes: 120
    needs: build
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    strategy:
      # Keep browser coverage on the Linux ARC pool; hosted OS runners are not
      # part of this repository's CI budget.
      matrix:
        include:
          # Cross-OS coverage is paused while this fork runs exclusively on
          # Linux ARC. Chrome, Firefox, Edge, and Opera remain covered.
          - browser: Chrome
            extra_flags: "--use-xvfb --running_in_vm"
          - browser: Firefox
            extra_flags: "--use-xvfb --running_in_vm"
          - browser: Edge
            extra_flags: "--html-coverage-report --uncompiled --use-xvfb --running_in_vm"
          - browser: Opera
            extra_flags: "--use-xvfb --running_in_vm"

      # Disable fail-fast so that one matrix-job failing doesn't make the other
      # ones end early.
      fail-fast: false

    name: Linux ${{ matrix.browser }}
    runs-on: default

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      # The Ubuntu CI image ships Edge with every file under /opt/microsoft
      # made world-writable, which strips the setuid bit from Edge's sandbox
      # helper.  Since Ubuntu also restricts unprivileged user namespaces,
      # Edge has no usable sandbox and aborts on startup.  Restore the
      # ownership and mode the package expects.
      - name: 'Fix Edge sandbox on Ubuntu'
        timeout-minutes: 5
        if: matrix.browser == 'Edge'
        run: |
          sudo chown root:root /opt/microsoft/msedge/msedge-sandbox
          sudo chmod 4755 /opt/microsoft/msedge/msedge-sandbox

      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: player-build
          path: dist/

      - name: Test Player
        # Fork runners (ARC) measured 17-25 min with setup+bundle+tests (BLO-51683);
        # upstream 25 left no margin.
        timeout-minutes: 45
        shell: bash
        run: |
          browser=${{ matrix.browser }}

          python3 build/test.py \
            --no-build \
            --browsers "$browser" \
            --reporters spec --spec-hide-passed \
            ${{ matrix.extra_flags }}

      - name: Find coverage reports
        id: coverage
        if: always() # Even on failure of an earlier step.
        shell: bash
        run: |
          # If the "coverage" directory exists...
          if [ -d coverage ]; then
            # Find the path to the coverage output folder.  It includes the
            # exact browser version in the path, so it will vary.
            coverage_folder="$( (ls -d coverage/* || true) | head -1 )"

            # Build a folder to stage all the coverage artifacts with
            # predictable paths.  The resulting zip file will not have any
            # internal directories.
            mkdir coverage/staging/
            cp "$coverage_folder"/coverage.json coverage/staging/
            cp "$coverage_folder"/coverage-details.json coverage/staging/
            echo "${{ github.event.number }}" > coverage/staging/pr-number.json

            echo "coverage_found=true" >> $GITHUB_OUTPUT
            echo "Coverage report staged."
          else
            echo "No coverage report generated."
          fi

      - name: Upload coverage reports
        uses: actions/upload-artifact@v6
        if: ${{ always() && steps.coverage.outputs.coverage_found }}
        with:
          name: coverage
          # This will create a download called coverage.zip containing all of
          # these files, with no internal folders.
          path: |
            coverage/staging/coverage.json
            coverage/staging/coverage-details.json
            coverage/staging/pr-number.json
          # Since we've already filtered this step for instances where there is
          # an environment variable set, the file should definitely be there.
          if-no-files-found: error

      # Upload new screenshots and diffs on failure; ignore if missing
      - name: Upload screenshots
        uses: actions/upload-artifact@v6
        if: ${{ failure() }}
        with:
          name: screenshots-${{ matrix.browser }}-linux
          path: |
            test/test/assets/screenshots/*/*.png-new
            test/test/assets/screenshots/*/*.png-diff
          if-no-files-found: ignore
          retention-days: 5

  build_in_docker:
    timeout-minutes: 120
    name: Docker
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: arc-default
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Docker
        run: |
          docker build -t shaka-player-build build/docker
          docker run -v $(pwd):/usr/src --user $(id -u):$(id -g) shaka-player-build
